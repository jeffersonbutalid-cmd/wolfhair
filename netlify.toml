# Wolf Hair Restoration — Netlify configuration
# Static site: no build step. The repo root is published as-is.

[build]
  publish = "."
  command = ""

# Clean URLs: serve /page instead of /page.html and drop the extension.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Security headers on every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Long-cache the fingerprinted static assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep HTML fresh so content edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
